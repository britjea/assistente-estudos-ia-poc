<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Material de Estudo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 32px auto;
      padding: 0 16px;
      color: #0a1030;
      background: #f4f8ff;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .subtitulo { color: #4a5888; font-size: 0.9rem; margin-bottom: 20px; }

    .abas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .aba-btn {
      background: #edf3ff; border: 1.5px solid #c0d0f0; border-radius: 20px;
      padding: 6px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      color: #1040c8;
    }
    .aba-btn.ativa { background: #1040c8; color: #fff; }
    .aba-btn.em-breve { opacity: 0.45; cursor: not-allowed; }

    .painel { display: none; }
    .painel.ativo { display: block; }

    .cap-titulo {
      background: linear-gradient(135deg, #0a1e80, #1040c8);
      color: #fff; border-radius: 10px 10px 0 0; padding: 10px 16px; margin-top: 18px;
    }
    .sec-titulo { font-size: 1rem; font-weight: 700; color: #1040c8; margin: 16px 0 8px; }

    .bloco-paragrafo { font-size: 0.92rem; line-height: 1.6; margin-bottom: 10px; }
    .bloco-lista { font-size: 0.9rem; line-height: 1.7; padding-left: 20px; margin-bottom: 10px; }

    .bloco-destaque {
      border-radius: 10px; padding: 12px 16px; margin: 10px 0; border-left: 4px solid;
    }
    .tom-azul { background: #e8f0ff; border-color: #1040c8; }
    .tom-verde-agua { background: #e8f8f5; border-color: #0a8a7a; }
    .tom-amarelo { background: #fff8e8; border-color: #c87010; }
    .tom-verde { background: #e8f8ee; border-color: #1a8a40; }
    .tom-vermelho { background: #fff0f0; border-color: #c01828; }
    .tom-roxo { background: #f0e8ff; border-color: #7010c0; }
    .bloco-destaque strong.titulo-destaque { display: block; margin-bottom: 4px; }

    .bloco-tabela { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.85rem; }
    .bloco-tabela th { background: #1040c8; color: #fff; padding: 7px 10px; text-align: left; }
    .bloco-tabela td { padding: 7px 10px; border-bottom: 1px solid #c0d0f0; }

    .bloco-formula {
      background: #0a1e80; color: #fff; border-radius: 10px; padding: 14px 18px;
      text-align: center; margin: 12px 0; font-weight: 700;
    }
    .bloco-formula span { display: block; font-size: 0.75rem; font-weight: 400; opacity: 0.75; margin-top: 4px; }

    .card {
      background: #edf3ff; border: 1.5px solid #c0d0f0; border-radius: 12px;
      padding: 16px; margin-bottom: 14px;
    }
    .card h4 { color: #1040c8; font-size: 0.9rem; margin-bottom: 8px; }
    .campo-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .campo-row input { border: 2px solid #c0d0f0; border-radius: 8px; padding: 7px 10px; width: 90px; }
    .campo-row label { font-size: 0.85rem; font-weight: 600; }
    button.acao {
      background: #1040c8; color: #fff; border: none; border-radius: 8px;
      padding: 7px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    button.acao.dica { background: #c87010; }
    .feedback { border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; margin-top: 8px; display: none; }
    .feedback.ok { background: #e8f8ee; color: #1a8a40; border: 1.5px solid #1a8a40; display: block; }
    .feedback.erro { background: #fff0f0; color: #c01828; border: 1.5px solid #c01828; display: block; }
    .dica-texto {
      background: #fff8e8; border: 1.5px solid #c87010; border-radius: 8px;
      padding: 8px 12px; font-size: 0.82rem; margin-top: 6px; display: none;
    }
    .dica-texto.visivel { display: block; }

    .quiz-filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .filtro-btn {
      background: #edf3ff; border: 2px solid #c0d0f0; border-radius: 20px;
      padding: 5px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; color: #1040c8;
    }
    .filtro-btn.ativo { background: #1040c8; color: #fff; }
    .q-opcao {
      display: block; width: 100%; text-align: left; background: #fff;
      border: 2px solid #c0d0f0; border-radius: 8px; padding: 8px 12px;
      font-size: 0.85rem; margin-bottom: 6px; cursor: pointer;
    }
    .q-opcao.certa { background: #e8f8ee; border-color: #1a8a40; color: #1a8a40; font-weight: 700; }
    .q-opcao.errada { background: #fff0f0; border-color: #c01828; color: #c01828; }
    .q-explicacao {
      background: #edf3ff; border: 1px solid #c0d0f0; border-radius: 8px;
      padding: 8px 12px; font-size: 0.82rem; margin-top: 8px; display: none;
    }
    .q-explicacao.visivel { display: block; }

    .erro-geral { color: #c01828; padding: 20px; }

    /* Simulado */
    .sim-opcao {
      display: block; width: 100%; text-align: left; background: #fff;
      border: 2px solid #c0d0f0; border-radius: 8px; padding: 8px 12px;
      font-size: 0.85rem; margin-bottom: 6px; cursor: pointer;
    }
    .sim-opcao.selecionada { border-color: #1040c8; background: #e8f0ff; }
    .sim-opcao.certa { background: #e8f8ee; border-color: #1a8a40; color: #1a8a40; font-weight: 700; }
    .sim-opcao.errada { background: #fff0f0; border-color: #c01828; }
    .sim-botoes { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
    .sim-resultado {
      background: linear-gradient(135deg, #1040c8, #0a8a7a); color: #fff;
      border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 16px; display: none;
    }
    .sim-resultado.visivel { display: block; }
    .sim-resultado .nota { font-size: 2.2rem; font-weight: 800; }

    /* Vídeos */
    .vid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .vid-card { background: #edf3ff; border: 1.5px solid #c0d0f0; border-radius: 12px; overflow: hidden; }
    .vid-card a { display: block; text-decoration: none; color: inherit; }
    .vid-card img { width: 100%; display: block; }
    .vid-card .vid-info { padding: 10px 12px; }
    .vid-card h4 { color: #1040c8; font-size: 0.85rem; margin-bottom: 3px; }
    .vid-card p { font-size: 0.78rem; color: #4a5888; }

    /* Dicas */
    .dica-card { border-left: 4px solid #1040c8; }
    .checklist { list-style: none; padding: 0; font-size: 0.85rem; }
    .checklist li { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; border-bottom: 1px solid #c0d0f0; }
    .checklist li:last-child { border: none; }

    /* Gabarito */
    .gab-tabela { width: 100%; border-collapse: collapse; margin: 10px 0 20px; font-size: 0.82rem; }
    .gab-tabela th { background: #1040c8; color: #fff; padding: 7px 10px; text-align: left; }
    .gab-tabela td { padding: 7px 10px; border-bottom: 1px solid #c0d0f0; vertical-align: top; }
  </style>
</head>
<body>
  <h1 id="titulo-material">Carregando…</h1>
  <p class="subtitulo" id="subtitulo-material"></p>

  <div class="abas">
    <button class="aba-btn ativa" data-painel="resumo">Resumo</button>
    <button class="aba-btn" data-painel="exercicios">Exercícios</button>
    <button class="aba-btn" data-painel="quiz">Quiz</button>
    <button class="aba-btn" data-painel="simulado">Simulado</button>
    <button class="aba-btn" data-painel="videos">Vídeos</button>
    <button class="aba-btn" data-painel="dicas">Dicas</button>
    <button class="aba-btn" data-painel="gabarito">Gabarito</button>
  </div>

  <div id="painel-resumo" class="painel ativo"></div>
  <div id="painel-exercicios" class="painel"></div>
  <div id="painel-quiz" class="painel"></div>
  <div id="painel-simulado" class="painel"></div>
  <div id="painel-videos" class="painel"></div>
  <div id="painel-dicas" class="painel"></div>
  <div id="painel-gabarito" class="painel"></div>

  <script>
    const materialId = window.location.pathname.split("/").filter(Boolean).pop();
    let dadosMaterial = null;

    let gabaritoCarregado = false;

    document.querySelectorAll(".abas .aba-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".abas .aba-btn").forEach((b) => b.classList.remove("ativa"));
        btn.classList.add("ativa");
        document.querySelectorAll(".painel").forEach((p) => p.classList.remove("ativo"));
        document.getElementById("painel-" + btn.dataset.painel).classList.add("ativo");

        // O Gabarito revela tudo — só busca quando o aluno pede, não no
        // carregamento inicial da página.
        if (btn.dataset.painel === "gabarito" && !gabaritoCarregado) {
          gabaritoCarregado = true;
          renderGabarito();
        }
      });
    });

    function textoComNegrito(texto) {
      const span = document.createElement("span");
      const partes = texto.split(/(\*\*[^*]+\*\*)/g);
      for (const parte of partes) {
        if (parte.startsWith("**") && parte.endsWith("**")) {
          const forte = document.createElement("strong");
          forte.textContent = parte.slice(2, -2);
          span.appendChild(forte);
        } else {
          span.appendChild(document.createTextNode(parte));
        }
      }
      return span;
    }

    function renderBloco(bloco) {
      if (bloco.tipo === "paragrafo") {
        const p = document.createElement("p");
        p.className = "bloco-paragrafo";
        p.appendChild(textoComNegrito(bloco.texto));
        return p;
      }
      if (bloco.tipo === "lista") {
        const lista = document.createElement(bloco.ordenada ? "ol" : "ul");
        lista.className = "bloco-lista";
        bloco.itens.forEach((item) => {
          const li = document.createElement("li");
          li.appendChild(textoComNegrito(item));
          lista.appendChild(li);
        });
        return lista;
      }
      if (bloco.tipo === "destaque") {
        const div = document.createElement("div");
        div.className = "bloco-destaque tom-" + bloco.tom;
        const titulo = document.createElement("strong");
        titulo.className = "titulo-destaque";
        titulo.textContent = bloco.titulo;
        div.appendChild(titulo);
        if (bloco.texto) {
          const p = document.createElement("p");
          p.appendChild(textoComNegrito(bloco.texto));
          div.appendChild(p);
        }
        if (bloco.itens) {
          const ul = document.createElement("ul");
          bloco.itens.forEach((item) => {
            const li = document.createElement("li");
            li.appendChild(textoComNegrito(item));
            ul.appendChild(li);
          });
          div.appendChild(ul);
        }
        return div;
      }
      if (bloco.tipo === "tabela") {
        const tabela = document.createElement("table");
        tabela.className = "bloco-tabela";
        const thead = document.createElement("thead");
        const trCab = document.createElement("tr");
        bloco.colunas.forEach((c) => {
          const th = document.createElement("th");
          th.textContent = c;
          trCab.appendChild(th);
        });
        thead.appendChild(trCab);
        tabela.appendChild(thead);
        const tbody = document.createElement("tbody");
        bloco.linhas.forEach((linha) => {
          const tr = document.createElement("tr");
          linha.forEach((valor) => {
            const td = document.createElement("td");
            td.textContent = valor;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        tabela.appendChild(tbody);
        return tabela;
      }
      if (bloco.tipo === "formula") {
        const div = document.createElement("div");
        div.className = "bloco-formula";
        div.appendChild(document.createTextNode(bloco.expressao));
        if (bloco.legenda) {
          const span = document.createElement("span");
          span.textContent = bloco.legenda;
          div.appendChild(span);
        }
        return div;
      }
      const desconhecido = document.createElement("p");
      desconhecido.textContent = "[bloco de tipo desconhecido: " + bloco.tipo + "]";
      return desconhecido;
    }

    function renderResumo() {
      const painel = document.getElementById("painel-resumo");
      painel.innerHTML = "";
      dadosMaterial.capitulos.forEach((cap) => {
        const bandaCap = document.createElement("div");
        bandaCap.className = "cap-titulo";
        bandaCap.innerHTML = "<h3>" + cap.titulo + "</h3>";
        painel.appendChild(bandaCap);

        cap.secoes.forEach((sec) => {
          const secTitulo = document.createElement("h4");
          secTitulo.className = "sec-titulo";
          secTitulo.textContent = sec.titulo;
          painel.appendChild(secTitulo);

          sec.blocos.forEach((bloco) => painel.appendChild(renderBloco(bloco)));
        });
      });
    }

    function renderExercicios() {
      const painel = document.getElementById("painel-exercicios");
      painel.innerHTML = "";
      dadosMaterial.exercicios.forEach((ex) => {
        const card = document.createElement("div");
        card.className = "card";

        const h4 = document.createElement("h4");
        h4.textContent = "Exercício " + ex.numero;
        card.appendChild(h4);

        const p = document.createElement("p");
        p.appendChild(textoComNegrito(ex.enunciado));
        card.appendChild(p);

        const row = document.createElement("div");
        row.className = "campo-row";
        ex.campos_entrada.forEach((campo) => {
          if (campo.rotulo) {
            const label = document.createElement("label");
            label.textContent = campo.rotulo;
            row.appendChild(label);
          }
          const input = document.createElement("input");
          input.type = "number";
          input.dataset.campoId = campo.campo_id;
          row.appendChild(input);
        });
        card.appendChild(row);

        const botaoVerificar = document.createElement("button");
        botaoVerificar.className = "acao";
        botaoVerificar.textContent = "Verificar";
        card.appendChild(botaoVerificar);

        let botaoDica = null;
        let dicaDiv = null;
        if (ex.dica) {
          botaoDica = document.createElement("button");
          botaoDica.className = "acao dica";
          botaoDica.textContent = "Dica";
          card.appendChild(botaoDica);

          dicaDiv = document.createElement("div");
          dicaDiv.className = "dica-texto";
          dicaDiv.textContent = ex.dica;
          card.appendChild(dicaDiv);

          botaoDica.addEventListener("click", () => dicaDiv.classList.toggle("visivel"));
        }

        const feedback = document.createElement("div");
        feedback.className = "feedback";
        card.appendChild(feedback);

        botaoVerificar.addEventListener("click", async () => {
          const resposta = {};
          row.querySelectorAll("input").forEach((input) => {
            resposta[input.dataset.campoId] = parseFloat(input.value);
          });

          const resp = await fetch(`/api/materiais/${materialId}/corrigir`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tipo: "exercicio", item_id: ex.id, resposta }),
          });
          const json = await resp.json();

          feedback.className = "feedback " + (json.correto ? "ok" : "erro");
          feedback.textContent = json.correto
            ? "Correto! " + (json.explicacao || "")
            : "Não foi dessa vez. Use a dica ou tente novamente.";
        });

        painel.appendChild(card);
      });
    }

    let categoriaAtual = "todos";

    function renderQuiz() {
      const painel = document.getElementById("painel-quiz");
      painel.innerHTML = "";

      const categorias = ["todos", ...new Set(dadosMaterial.quiz.map((q) => q.categoria))];
      const filtros = document.createElement("div");
      filtros.className = "quiz-filtros";
      categorias.forEach((cat) => {
        const btn = document.createElement("button");
        btn.className = "filtro-btn" + (cat === categoriaAtual ? " ativo" : "");
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          categoriaAtual = cat;
          renderQuiz();
        });
        filtros.appendChild(btn);
      });
      painel.appendChild(filtros);

      const questoes =
        categoriaAtual === "todos"
          ? dadosMaterial.quiz
          : dadosMaterial.quiz.filter((q) => q.categoria === categoriaAtual);

      questoes.forEach((q) => {
        const card = document.createElement("div");
        card.className = "card";

        const pergunta = document.createElement("p");
        pergunta.appendChild(textoComNegrito(q.pergunta));
        card.appendChild(pergunta);

        const explicacaoDiv = document.createElement("div");
        explicacaoDiv.className = "q-explicacao";

        let respondida = false;
        q.opcoes.forEach((opcao, indice) => {
          const botao = document.createElement("button");
          botao.className = "q-opcao";
          botao.textContent = opcao;
          botao.addEventListener("click", async () => {
            if (respondida) return;
            respondida = true;

            const resp = await fetch(`/api/materiais/${materialId}/corrigir`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ tipo: "quiz", item_id: q.id, resposta: indice }),
            });
            const json = await resp.json();

            botao.classList.add(json.correto ? "certa" : "errada");
            explicacaoDiv.textContent = json.explicacao || "";
            explicacaoDiv.classList.add("visivel");
          });
          card.appendChild(botao);
        });

        card.appendChild(explicacaoDiv);
        painel.appendChild(card);
      });
    }

    // --- Simulado: correção em lote (responde tudo, corrige de uma vez) ---

    let respostasSimulado = {};

    function renderSimulado() {
      respostasSimulado = {};
      const painel = document.getElementById("painel-simulado");
      painel.innerHTML = "";

      const resultado = document.createElement("div");
      resultado.className = "sim-resultado";
      resultado.id = "sim-resultado";
      painel.appendChild(resultado);

      dadosMaterial.simulado.forEach((s) => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.itemId = s.id;

        const pergunta = document.createElement("p");
        pergunta.appendChild(textoComNegrito(s.pergunta));
        card.appendChild(pergunta);

        s.opcoes.forEach((opcao, indice) => {
          const botao = document.createElement("button");
          botao.className = "sim-opcao";
          botao.textContent = opcao;
          botao.dataset.indice = indice;
          botao.addEventListener("click", () => {
            card.querySelectorAll(".sim-opcao").forEach((b) => b.classList.remove("selecionada"));
            botao.classList.add("selecionada");
            respostasSimulado[s.id] = indice;
          });
          card.appendChild(botao);
        });

        painel.appendChild(card);
      });

      const botoes = document.createElement("div");
      botoes.className = "sim-botoes";

      const corrigirBtn = document.createElement("button");
      corrigirBtn.className = "acao";
      corrigirBtn.textContent = "Corrigir Simulado";
      corrigirBtn.addEventListener("click", async () => {
        const resp = await fetch(`/api/materiais/${materialId}/simulado/corrigir`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ respostas: respostasSimulado }),
        });
        const json = await resp.json();

        painel.querySelectorAll(".card[data-item-id]").forEach((card) => {
          const itemId = card.dataset.itemId;
          const infoQuestao = json.por_questao[itemId];
          if (!infoQuestao) return;
          card.querySelectorAll(".sim-opcao").forEach((botao) => {
            const indice = parseInt(botao.dataset.indice, 10);
            if (indice === infoQuestao.indice_correto) botao.classList.add("certa");
            else if (botao.classList.contains("selecionada")) botao.classList.add("errada");
          });
        });

        resultado.innerHTML =
          `<div class="nota">${json.nota}/${json.total}</div><div>${json.percentual}% de acerto</div>`;
        resultado.classList.add("visivel");
        window.scrollTo({ top: resultado.offsetTop - 80, behavior: "smooth" });
      });
      botoes.appendChild(corrigirBtn);

      const recomecarBtn = document.createElement("button");
      recomecarBtn.className = "acao";
      recomecarBtn.style.background = "#4a5888";
      recomecarBtn.textContent = "Recomeçar";
      recomecarBtn.addEventListener("click", () => renderSimulado());
      botoes.appendChild(recomecarBtn);

      painel.insertBefore(botoes, painel.firstChild.nextSibling);
    }

    // --- Vídeos: link de sugestão + miniatura, derivados do youtube_id ---

    function renderVideos() {
      const painel = document.getElementById("painel-videos");
      painel.innerHTML = "";
      const grid = document.createElement("div");
      grid.className = "vid-grid";

      dadosMaterial.videos.forEach((v) => {
        const card = document.createElement("div");
        card.className = "vid-card";

        const link = document.createElement("a");
        link.href = `https://www.youtube.com/watch?v=${v.youtube_id}`;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const img = document.createElement("img");
        img.src = `https://img.youtube.com/vi/${v.youtube_id}/mqdefault.jpg`;
        img.alt = v.titulo;
        link.appendChild(img);

        const info = document.createElement("div");
        info.className = "vid-info";
        const h4 = document.createElement("h4");
        h4.textContent = v.titulo;
        const p = document.createElement("p");
        p.textContent = v.descricao;
        info.appendChild(h4);
        info.appendChild(p);
        link.appendChild(info);

        card.appendChild(link);
        grid.appendChild(card);
      });

      painel.appendChild(grid);
    }

    // --- Dicas: cards simples, com variante checklist ---

    function renderDicas() {
      const painel = document.getElementById("painel-dicas");
      painel.innerHTML = "";

      dadosMaterial.dicas.forEach((d) => {
        const card = document.createElement("div");
        card.className = "card dica-card";

        const h4 = document.createElement("h4");
        h4.textContent = d.titulo;
        card.appendChild(h4);

        if (d.checklist) {
          const ul = document.createElement("ul");
          ul.className = "checklist";
          d.itens.forEach((item) => {
            const li = document.createElement("li");
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            const span = document.createElement("span");
            span.textContent = item;
            li.appendChild(checkbox);
            li.appendChild(span);
            ul.appendChild(li);
          });
          card.appendChild(ul);
        } else if (d.itens) {
          const ul = document.createElement("ul");
          ul.className = "bloco-lista";
          d.itens.forEach((item) => {
            const li = document.createElement("li");
            li.appendChild(textoComNegrito(item));
            ul.appendChild(li);
          });
          card.appendChild(ul);
        } else if (d.texto) {
          const p = document.createElement("p");
          p.appendChild(textoComNegrito(d.texto));
          card.appendChild(p);
        }

        painel.appendChild(card);
      });
    }

    // --- Gabarito: busca sob demanda, só quando a aba é clicada ---

    async function renderGabarito() {
      const painel = document.getElementById("painel-gabarito");
      painel.textContent = "Carregando…";

      const resp = await fetch(`/api/materiais/${materialId}/gabarito`);
      if (!resp.ok) {
        painel.innerHTML = '<p class="erro-geral">Erro ao carregar o gabarito.</p>';
        return;
      }
      const gabarito = await resp.json();
      painel.innerHTML = "";

      const secoes = [
        ["Exercícios", gabarito.exercicios],
        ["Quiz", gabarito.quiz],
        ["Simulado", gabarito.simulado],
      ];

      secoes.forEach(([titulo, itens]) => {
        if (itens.length === 0) return;
        const h3 = document.createElement("h3");
        h3.className = "sec-titulo";
        h3.textContent = titulo;
        painel.appendChild(h3);

        const tabela = document.createElement("table");
        tabela.className = "gab-tabela";
        tabela.innerHTML = "<thead><tr><th>#</th><th>Resposta</th><th>Explicação</th></tr></thead>";
        const tbody = document.createElement("tbody");
        itens.forEach((item) => {
          const tr = document.createElement("tr");
          const tdId = document.createElement("td");
          tdId.textContent = item.identificador;
          const tdResp = document.createElement("td");
          tdResp.textContent = item.resposta_formatada;
          const tdExp = document.createElement("td");
          tdExp.textContent = item.explicacao || "";
          tr.appendChild(tdId);
          tr.appendChild(tdResp);
          tr.appendChild(tdExp);
          tbody.appendChild(tr);
        });
        tabela.appendChild(tbody);
        painel.appendChild(tabela);
      });
    }

    async function iniciar() {
      try {
        const resp = await fetch(`/api/materiais/${materialId}`);
        if (!resp.ok) {
          document.getElementById("titulo-material").textContent = "Material não encontrado";
          return;
        }
        dadosMaterial = await resp.json();

        document.getElementById("titulo-material").textContent = dadosMaterial.metadados.titulo;
        document.getElementById("subtitulo-material").textContent =
          dadosMaterial.metadados.disciplina + " · " + dadosMaterial.metadados.ano_serie;

        renderResumo();
        renderExercicios();
        renderQuiz();
        renderSimulado();
        renderVideos();
        renderDicas();
        // Gabarito é buscado sob demanda — ver o listener de clique das abas.
      } catch (erro) {
        document.body.innerHTML = '<p class="erro-geral">Erro ao carregar o material.</p>';
      }
    }

    iniciar();
  </script>
</body>
</html>
