<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Assistente de Estudos — POC</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }
    h1 { font-size: 1.4rem; }
    #resposta {
      white-space: pre-wrap;
      background: #f5f5f0;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      line-height: 1.5;
    }
    #meta {
      font-size: 0.8rem;
      color: #666;
      margin-top: 8px;
    }
    button {
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
    .erro { color: #b00020; }
  </style>
</head>
<body>
  <h1>📚 Assistente de Estudos (experimento local)</h1>
  <p>Selecione uma foto (JPEG ou PNG, até 5 MB) de um exercício escolar para receber uma explicação.</p>

  <form id="form-upload">
    <input type="file" id="input-imagem" accept="image/jpeg,image/png" required />
    <button type="submit">Explicar exercício</button>
  </form>

  <div id="carregando" style="display:none;">Pensando...</div>
  <div id="resposta"></div>
  <div id="meta"></div>

  <script>
    const form = document.getElementById("form-upload");
    const respostaEl = document.getElementById("resposta");
    const metaEl = document.getElementById("meta");
    const carregandoEl = document.getElementById("carregando");

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const arquivo = document.getElementById("input-imagem").files[0];
      if (!arquivo) return;

      respostaEl.textContent = "";
      metaEl.textContent = "";
      respostaEl.classList.remove("erro");
      carregandoEl.style.display = "block";

      const dados = new FormData();
      dados.append("imagem", arquivo);

      try {
        const resp = await fetch("/explicar", { method: "POST", body: dados });
        const json = await resp.json();

        if (!resp.ok) {
          respostaEl.classList.add("erro");
          respostaEl.textContent = "Erro: " + (json.detail || "falha desconhecida");
          return;
        }

        respostaEl.textContent = json.explicacao;
        metaEl.textContent =
          `Modelo: ${json.modelo} · tokens entrada: ${json.input_tokens} · ` +
          `tokens saída: ${json.output_tokens} · tempo: ${json.tempo_resposta_s}s · ` +
          `custo estimado: US$ ${json.custo_usd_estimado} · ` +
          `chamadas restantes neste limite local: ${json.chamadas_restantes}`;
      } catch (erro) {
        respostaEl.classList.add("erro");
        respostaEl.textContent = "Erro de conexão com o servidor.";
      } finally {
        carregandoEl.style.display = "none";
      }
    });
  </script>
</body>
</html>
